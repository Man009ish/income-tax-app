<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>आयकर गणना पोर्टल</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #f8fafc; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <!-- नीचे src में अपना Google Apps Script का पूरा URL पेस्ट करें -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbzhWwJtIPEl-r8U0Q4KcmU4kspQXDWw9btsxKKpbEJJ3Pss21Mx800zyKaBb-0PfjU5lw/exec" 
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
